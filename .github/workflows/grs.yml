name: Atualizar estatisticas do GitHub

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v6

      - name: Gerar card de estatisticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "username=ChristianDSR&show_icons=true&theme=tokyonight&locale=pt-br&custom_title=Estat%C3%ADsticas%20do%20GitHub%20de%20Christian%20Rodrigues"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar card de tecnologias
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=ChristianDSR&layout=compact&langs_count=6&theme=tokyonight&locale=pt-br&custom_title=Tecnologias"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar cards no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualizar estatisticas do perfil" || exit 0
          git push
